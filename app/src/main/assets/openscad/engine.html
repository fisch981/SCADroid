<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SCADroid OpenSCAD Engine</title>
  <script src="openscad.js"></script>
</head>
<body>
  <script>
    let instance = null;

    window.initOpenScad = async function() {
      try {
        if (!instance) {
          const fn = window.createOpenSCAD || globalThis.createOpenSCAD;
          if (typeof fn !== 'function') {
            throw new Error("createOpenSCAD is not defined on window/globalThis");
          }
          instance = await fn();
        }
        if (window.AndroidBridge && window.AndroidBridge.onEngineReady) {
          window.AndroidBridge.onEngineReady();
        }
      } catch (err) {
        console.error("Init Error: ", err);
        if (window.AndroidBridge && window.AndroidBridge.onError) {
          window.AndroidBridge.onError("Init Error: " + (err.stack || err.message || err));
        }
      }
    };

    window.renderScad = async function(scadCode) {
      try {
        if (!instance) {
          const fn = window.createOpenSCAD || globalThis.createOpenSCAD;
          if (typeof fn !== 'function') {
            throw new Error("createOpenSCAD is not defined on window/globalThis");
          }
          instance = await fn();
        }
        const stlString = await instance.renderToStl(scadCode);
        if (window.AndroidBridge) {
          if (stlString.length > 300000) {
            window.AndroidBridge.onRenderChunkStart(stlString.length);
            const chunkSize = 200000;
            for (let i = 0; i < stlString.length; i += chunkSize) {
              window.AndroidBridge.onRenderChunk(stlString.substring(i, i + chunkSize));
            }
            window.AndroidBridge.onRenderChunkEnd();
          } else {
            window.AndroidBridge.onRenderSuccess(stlString);
          }
        }
      } catch (err) {
        console.error("Render Error: ", err);
        if (window.AndroidBridge && window.AndroidBridge.onError) {
          window.AndroidBridge.onError("Render Error: " + (err.stack || err.message || err));
        }
      }
    };

    window.renderScadBase64 = function(b64) {
      try {
        const binString = atob(b64);
        const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
        const decoded = new TextDecoder().decode(bytes);
        return window.renderScad(decoded);
      } catch (err) {
        console.error("Base64 Decode Error: ", err);
        if (window.AndroidBridge && window.AndroidBridge.onError) {
          window.AndroidBridge.onError("Base64 Decode Error: " + (err.stack || err.message || err));
        }
      }
    };

    window.initOpenScad();
  </script>
</body>
</html>
